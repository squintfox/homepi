# See PEP 518 for the spec of this file
# https://www.python.org/dev/peps/pep-0518/

[project]
name = "homepi"
authors = [{ name = "Robert Spadaro", email = "robertjspadaro@gmail.com" }]
description = "HomePi"
readme = "README.md"
version = "0.2.0"
requires-python = ">=3.14.0"

dependencies = [
    "configtool",
    "configtool-client",
    "configtool-secrets",
    "tofupy>=1.1.2",
]

[dependency-groups]
dev = [
    "black>=24.10.0",
    "isort>=5.13.2",
    "pre-commit>=4.0.1",
    "ruff>=0.9.0",
    "setuptools>=75.7.0",
    "build>=1.3.0",
]

[project.urls]
Documentation = "https://github.com/squintfox/homepi/blob/main/README.md"
Source = "https://github.com/squintfox/homepi/"

[tool.uv]
default-groups = []

[tool.uv.sources]
configtool = { git = "https://github.com/squintfox/configtool" }
configtool-client = { git = "https://github.com/squintfox/configtool", subdirectory = "configtool-client" }
configtool-secrets = { git = "https://github.com/squintfox/configtool", subdirectory = "configtool-secrets" }

[tool.black]
line-length = 92
target-version = ['py312', 'py313']
skip-string-normalization = true

[tool.isort]
profile = 'black'
line_length = 92
