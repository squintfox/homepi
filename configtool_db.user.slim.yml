homepi:
  environments:
    base:
      - homepi.default
      - homepi_shared.network

  config:
    homepi:
      default: {}

    homepi_shared:
      default:
        # RECOMMENDED
        hpi_time_zone:
          value: 'America/Los_Angeles'
          env:
            - HPI_TIME_ZONE
            - TF_VAR_HPI_TIME_ZONE
        # REQUIRED
        hpi_primary_email:
          value: 'robertjspadaro@gmail.com'
          env:
            - HPI_PRIMARY_EMAIL
            - TF_VAR_HPI_PRIMARY_EMAIL
            - CFGT_VAULTWARDEN_USERNAME

      network:
        # REQUIRED
        hpi_local_ip_address:
          value: '192.168.10.3'
          env:
            - HPI_LOCAL_IP_ADDRESS
            - TF_VAR_HPI_LOCAL_IP_ADDRESS
        # REQUIRED
        hpi_dns_domain:
          value: 'stuffthatsfine.com'
          env:
            - HPI_DNS_DOMAIN
            - TF_VAR_HPI_DNS_DOMAIN

    homepi_secrets:
      default: {}
      # REQUIRED
      vault:
        secret_type:
          value: vaultwarden
        vault-url:
          value: 'https://vault.${HPI_DNS_DOMAIN}:${HPI_HTTPS_PORT}'
        folder-name:
          value: 'homepi'
